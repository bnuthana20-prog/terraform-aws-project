name: Docker CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: BUILD
        run: |
          docker build -t bnuthana/my-first-app:latest .

      - name: TEST
        run: |
          docker rm -f test-app || true
          docker run -d -p 8080:80 --name test-app bnuthana/my-first-app:latest
          sleep 10
          curl -f http://localhost:8080
          docker rm -f test-app

      - name: PUSH
        run: |
          docker push bnuthana/my-first-app:latest

      - name: DEPLOY to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker rm -f my-first-app || true
            docker pull bnuthana/my-first-app:latest
            docker run -d -p 80:80 --name my-first-app --restart always bnuthana/my-first-app:latest
