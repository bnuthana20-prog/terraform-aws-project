name: CI Pipeline - Build Test Push Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Get code
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 2: BUILD - Make Docker Image
      - name: Build Docker Image
        run: |
          echo "Building image..."
          docker build -t bnuthana20/terraform-aws-project:latest .
          docker images

      # STEP 3: TEST - Run and Test
      - name: Test Docker Image
        run: |
          echo "Cleaning old test containers..."
          docker rm -f test-app || true
          
          echo "Running image on 8080..."
          docker run -d -p 8080:80 --name test-app bnuthana20/terraform-aws-project:latest
          
          echo "Waiting 10 sec for nginx..."
          sleep 10
          
          echo "Testing with curl..."
          curl -f http://localhost:8080 || (echo "TEST FAILED"; docker logs test-app; exit 1)
          
          echo "Test PASSED ✅"
          docker rm -f test-app || true

      # STEP 4: PUSH to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to DockerHub
        run: |
          docker push bnuthana20/terraform-aws-project:latest
          echo "Pushed to DockerHub ✅"

      # STEP 5: DEPLOY to EC2
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Pulling latest image..."
            docker pull bnuthana20/terraform-aws-project:latest
            
            echo "Stopping old app..."
            docker rm -f my-app || true
            
            echo "Starting new app..."
            docker run -d -p 80:80 --name my-app --restart always bnuthana20/terraform-aws-project:latest
            
            echo "Deployment done ✅"
            docker ps
