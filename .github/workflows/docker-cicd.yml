name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/terraform-aws-project:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Force remove ANY container on port 80
          docker ps -q --filter "publish=80" | xargs -r docker rm -f || true
          docker rm -f my-app || true
          
          # Kill if nginx running directly on EC2
          sudo systemctl stop nginx || true
          sudo fuser -k 80/tcp || true
          
          sleep 3
          
          # Pull and Run
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/terraform-aws-project:latest
          docker run -d -p 80:80 --name my-app --restart always ${{ secrets.DOCKERHUB_USERNAME }}/terraform-aws-project:latest
          
          sleep 2
          docker ps
          curl -f http://localhost || docker logs my-app
