name: build-and-deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Docker image
      run: |
        docker build -t ${{ steps.login-ecr.outputs.registry }}/devops-app:latest .
        docker push ${{ steps.login-ecr.outputs.registry }}/devops-app:latest

    - name: Deploy to EC2
      run: |
        for host in 65.0.122.7 3.108.64.26 13.233.155.3
        do
          echo "Deploying to $host"
          ssh -o StrictHostKeyChecking=no -i ${{ secrets.EC2_SSH_KEY }} ubuntu@$host "
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 717491933397.dkr.ecr.ap-south-1.amazonaws.com &&
            docker pull 717491933397.dkr.ecr.ap-south-1.amazonaws.com/devops-app:latest &&
            docker stop app || true &&
            docker rm app || true &&
            docker run -d --name app -p 80:80 717491933397.dkr.ecr.ap-south-1.amazonaws.com/devops-app:latest
          "
        done
