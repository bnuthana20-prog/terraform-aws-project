name: CI/CD Pipeline to AWS

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # 1. CHECKOUT
    - name: Checkout Code
      uses: actions/checkout@v4
      
    # 2. DOCKER BUILD + PUSH - No npm needed
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/mywebsite:latest
        
    # 3. DEPLOY TO AWS EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/mywebsite:latest
          docker stop mywebsite || true
          docker rm mywebsite || true
          docker run -d -p 80:80 --name mywebsite \
            --restart always \
            ${{ secrets.DOCKER_USERNAME }}/mywebsite:latest
